name : Hprofile Actions
on: workflow_dispatch
jobs:
  Testing:
    runs-on: ubuntu-latest
    steps:
     - name: Code checkout
       uses: actions/checkout@v7

     - name: Maven test
       run: mvn test

     - name: Checkstyle
       run: mvn checkstyle:checkstyle


     # setup java 11 to be default (sonar-scanner requirement as of S.x)
     - name: Set java 11
       uses: actions/setup-java@v7
       with:
        distribution: 'temurin' # 'Supoorted distribution' for avialable
        java-version: '25'
        
        
     # Setup sonar-scanner
     - name: Setup SonarQube
       uses: warchant/setup-sonar-scanner@v8
       with:
        version: 7.2.0.5079

     # Run sonar-scanner
     - name: SonarQube Scan
       run:  sonar-scanner
           -Dsonar.host.url=${{ secrets.SONAR_URL }}
           -Dsonar.login=${{ secrets.SONAR_TOKEN }}
           -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
           -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
           -Dsonar.sources=src/
           -Dsonar.junit.reportsPath=target/surefire-reports/
           -Dsonar.jacoco.reportsPath=target/jacoco.exec
           -Dsonar.javacheckstyle.reportPaths=target/checkstyle-result.xml
           -Donsar.java.binaries=target/test-classes/com/visualpathit/account
