name: Hprofile Actions

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITRY: actapp
  ECS_SERVICE: vproapp-act-svc
  ECS_CLUSTER: vproapp-act
  ECS_TASK_DEFINITION: aws-files/taskdeffile.json
  CONTAINER_NAME: vproapp


jobs:
  Testing:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository
      - name: Code checkout
        uses: actions/checkout@v4

      # Step 2: Run Maven unit tests
      - name: Maven test
        run: mvn test

      # Step 3: Check code formatting/style standards
      - name: Checkstyle
        run: mvn checkstyle:checkstyle

      # Step 4: Install Java 21 required by modern SonarCloud
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Step 5: Install Sonar Scanner CLI
      - name: Setup SonarQube Scanner
        uses: warchant/setup-sonar-scanner@v7

      # Step 6: Execute SonarCloud analysis using runner's Java 21
      - name: SonarQube Scan
        run: |
          SCANNER_HOME=$(dirname $(dirname $(which sonar-scanner)))
          $JAVA_HOME/bin/java -jar $SCANNER_HOME/lib/sonar-scanner-cli-*.jar \
          -Dsonar.host.url="https://sonarcloud.io" \
          -Dsonar.token="${{ secrets.SONAR_TOKEN }}" \
          -Dsonar.organization="hprofile79" \
          -Dsonar.projectKey="hprofile79_actionscode" \
          -Dsonar.sources=src/ \
          -Dsonar.junit.reportPath=target/surefire-reports/ \
          -Dsonar.jacoco.reportPath=target/jacoco.exec \
          -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml \
          -Dsonar.java.binaries=target/classes,target/test-classes
  
  BUILD_AND_PUBLISH:
    needs: Testing
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        
      - name: update application.properties file
        run: |
         sed -i "s/^jdbc.username.*$/jdbc.username\=${{ secrets.RDS_USER }}/" src/main/resources/application.properties
         sed -i "s/^jdbc.password.*$/jdbc.password\=${{ secrets.RDS_PASS }}/" src/main/resources/application.properties
         sed -i "s/db01/${{ secrets.RDS_ENDPOINT }}/" src/main/resources/application.properties

      - name: upload image to ECR
        uses: appleboy/docker-ecr-action@master
        with:
         access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
         secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         registry: ${{ secrets.REGISTRY }}
         repo: actapp
         region: ${{ env.AWS_REGION }}
         tags: latest,${{ github.run_number }}
         daemon_off: false
         dockerfile: ./Dockerfile
         context: ./

  Deploy:
    needs: BUILD_AND_PUBLISH
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
         task-definition: ${{ env.ECS_TASK_DEFINITION }}
         container-name: ${{ env.CONTAINER_NAME }}
         image: ${{ secrets.REGISTRY }}/${{ env.ECR_REPOSITRY }}:${{ github.run_number }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
         task-definition: ${{ steps.task-def.outputs.task-definition }}
         service: ${{ env.ECS_SERVICE }}
         cluster: ${{ env.ECS_CLUSTER }}
         wait-for-service-stability: true  
        
        



